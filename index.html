<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visualize Markdown no navegador com temas personalizáveis." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M7 22V10h3l3 4 3-4h3v12h-3v-7l-3 4-3-4v7zM22 16h2v-6h2v6h2l-3 4z' fill='white'/%3E%3C/svg%3E" />
    <title>Preview Markdown</title>
  </head>
  <body>
    <a class="skip-link" href="#editor">Pular para o editor</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M↓</span>
        <div class="brand-text">
          <h1>Preview Markdown</h1>
          <p class="file-name" id="file-name" aria-live="polite">Documento sem título</p>
        </div>
      </div>

      <nav class="actions" aria-label="Ações do documento">
        <button type="button" class="btn" id="open-btn" title="Abrir arquivo (Ctrl+O)" aria-keyshortcuts="Control+O">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="btn-label">Abrir arquivo</span>
        </button>
        <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
        <button type="button" class="btn" id="clear-btn" title="Limpar o editor">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          <span class="btn-label">Limpar</span>
        </button>
        <button type="button" class="btn" id="sample-btn" title="Carregar texto de exemplo">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>
          <span class="btn-label">Exemplo</span>
        </button>

        <div class="segmented" role="radiogroup" aria-label="Modo de visualização" aria-keyshortcuts="Control+Shift+P">
          <span class="seg-indicator" aria-hidden="true"></span>
          <button type="button" role="radio" data-view="editor" aria-checked="false" title="Somente editor">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg><span class="seg-label">Editor</span>
          </button>
          <button type="button" role="radio" data-view="split" aria-checked="true" title="Editor e prévia lado a lado">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg><span class="seg-label">Dividido</span>
          </button>
          <button type="button" role="radio" data-view="preview" aria-checked="false" title="Somente prévia">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="seg-label">Prévia</span>
          </button>
        </div>

        <button type="button" class="btn btn-primary" id="theme-btn" aria-haspopup="dialog">
          <span class="theme-dot" id="theme-dot" aria-hidden="true"></span>
          <span>Tema: <strong id="theme-name">Claro</strong></span>
        </button>
      </nav>
    </header>

    <main class="workspace" id="workspace" data-view="split">
      <section class="pane pane-editor" aria-labelledby="editor-label">
        <div class="pane-head">
          <label id="editor-label" for="editor">Markdown</label>
          <span class="stats" id="stats" aria-live="polite"></span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off"
          placeholder="Cole ou digite Markdown aqui, ou arraste um arquivo .md para a página…"></textarea>
      </section>

      <div class="splitter" aria-hidden="true"></div>

      <section class="pane pane-preview" aria-labelledby="preview-label">
        <div class="pane-head">
          <span id="preview-label">Prévia</span>
          <span class="persist-badge" id="persist-badge"></span>
        </div>
        <div class="drop-hint" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>
          Arraste um <strong>.md</strong> para qualquer lugar
        </div>
        <div class="preview-scroll" id="preview-scroll" tabindex="0" aria-label="Prévia renderizada">
          <article class="md" id="preview"></article>
        </div>
      </section>
    </main>

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
      <div class="drop-glow" aria-hidden="true"></div>
      <div class="drop-card">
        <div class="drop-ring">
          <div class="drop-doc">
            <span class="doc-fold"></span>
            <span class="doc-label">MD</span>
            <span class="doc-line"></span><span class="doc-line short"></span><span class="doc-line"></span>
          </div>
          <svg class="drop-arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5"/></svg>
        </div>
        <p class="drop-title">Solte para abrir</p>
        <p class="drop-sub" id="drop-sub">Arquivos .md, .markdown ou .txt</p>
      </div>
    </div>

    <div class="sr-only" id="announcer" aria-live="polite"></div>
    <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

    <!-- Seletor de temas -->
    <dialog class="sheet" id="theme-dialog" aria-labelledby="theme-dialog-title">
      <div class="sheet-head">
        <h2 id="theme-dialog-title">Escolha um tema</h2>
        <div class="sheet-head-actions">
          <button type="button" class="btn btn-primary" id="create-theme-btn">+ Criar tema</button>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
        </div>
      </div>
      <div class="sheet-body">
        <h3 class="group-title">Temas nativos</h3>
        <div class="theme-grid" id="builtin-grid" role="radiogroup" aria-label="Temas nativos"></div>
        <h3 class="group-title">Meus temas</h3>
        <div class="theme-grid" id="custom-grid" role="radiogroup" aria-label="Temas personalizados"></div>
        <p class="empty-note" id="custom-empty">Você ainda não criou temas. Use <strong>Criar tema</strong> ou duplique um tema nativo.</p>
      </div>
    </dialog>

    <!-- Criador de temas -->
    <dialog class="sheet sheet-wide" id="editor-dialog" aria-labelledby="editor-dialog-title">
      <form id="theme-form" method="dialog" novalidate>
        <div class="sheet-head">
          <h2 id="editor-dialog-title">Criar tema</h2>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
        </div>
        <div class="creator">
          <div class="creator-fields">
            <label class="field">
              <span>Nome do tema</span>
              <input type="text" name="name" maxlength="40" required placeholder="Ex.: Meu tema noturno" />
            </label>
            <label class="field">
              <span>Partir de</span>
              <select name="base" id="base-select"></select>
            </label>
            <div id="color-fields"></div>
            <fieldset class="group">
              <legend>Tipografia</legend>
              <label class="field"><span>Fonte do corpo</span><select name="bodyFont" data-font></select></label>
              <label class="field"><span>Fonte dos títulos</span><select name="headingFont" data-font></select></label>
              <label class="field range">
                <span>Tamanho da fonte <output name="fontSizeOut"></output></span>
                <input type="range" name="fontSize" min="12" max="24" step="1" />
              </label>
              <label class="field range">
                <span>Espaçamento entre linhas <output name="lineHeightOut"></output></span>
                <input type="range" name="lineHeight" min="1.2" max="2.2" step="0.05" />
              </label>
              <label class="field range">
                <span>Arredondamento do código <output name="codeRadiusOut"></output></span>
                <input type="range" name="codeRadius" min="0" max="20" step="1" />
              </label>
            </fieldset>
            <p class="contrast-note" id="contrast-note" aria-live="polite"></p>
          </div>
          <div class="creator-preview" aria-label="Amostra do tema">
            <div class="sample-page" id="sample-page">
              <article class="md" id="sample-md"></article>
            </div>
          </div>
        </div>
        <div class="sheet-foot">
          <button type="button" class="btn" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary" id="save-theme-btn">Salvar tema</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
